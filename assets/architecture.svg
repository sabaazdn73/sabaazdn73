<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" width="1160" height="680" role="img" aria-label="How my work fits together: expert tasks, the model under test, an equipped grader, a report and a human sign-off, all sharing a private library of adopted code editions that Tnega also uses">
<style>
text{font-family:'Hanken Grotesk','Avenir Next','Segoe UI',Helvetica,Arial,sans-serif}
.flow{stroke-dasharray:7 7;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{0%,100%{stroke-opacity:.6}50%{stroke-opacity:1}}
</style>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C85C"/><stop offset="1" stop-color="#E8607A"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1d55"/><stop offset="1" stop-color="#241c78"/></linearGradient>
<linearGradient id="hu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C85C"/><stop offset="1" stop-color="#f0a65e"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F7C85C"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8607A"/></marker>
</defs>
<rect x="4" y="4" width="1152" height="672" rx="30" fill="url(#bg)" stroke="url(#bd)" stroke-width="3.5"/>
<text x="40" y="58" font-size="30" font-weight="900" fill="#fff">How my work fits together</text>
<text x="40" y="88" font-size="17" font-weight="500" fill="#e9e4ff">The human leads where the truth is outside the model. AI drafts, runs and recomputes everything else.</text>
<rect x="40" y="168" width="200" height="170" rx="18" fill="url(#hu)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/><rect x="56" y="182" width="61" height="22" rx="11" fill="#081334"/><text x="86.5" y="198" font-size="12" font-weight="800" fill="#F7C85C" text-anchor="middle" letter-spacing="1.2">HUMAN</text><text x="56" y="230" font-size="19" font-weight="900" fill="#081334">1 · Expert task</text><text x="56" y="254" font-size="14" font-weight="500" fill="#2a1e10">Problem, design basis,</text><text x="56" y="274" font-size="14" font-weight="500" fill="#2a1e10">adopted code edition,</text><text x="56" y="294" font-size="14" font-weight="500" fill="#2a1e10">traps and answer key</text>
<rect x="265" y="168" width="200" height="170" rx="18" fill="#16246a" stroke="#F7C85C" stroke-opacity="0.55" stroke-width="2"/><rect x="281" y="182" width="102" height="22" rx="11" fill="#F7C85C"/><text x="332.0" y="198" font-size="12" font-weight="800" fill="#081334" text-anchor="middle" letter-spacing="1.2">CLAUDE API</text><text x="281" y="230" font-size="18" font-weight="900" fill="#fff">2 · Model under test</text><text x="281" y="254" font-size="14" font-weight="500" fill="#d9d3ff">Haiku 5.5, Sonnet 5.5</text><text x="281" y="274" font-size="14" font-weight="500" fill="#d9d3ff">k trials per task</text><text x="281" y="294" font-size="14" font-weight="500" fill="#d9d3ff">+ Python sandbox</text>
<rect x="490" y="168" width="200" height="170" rx="18" fill="#16246a" stroke="#F7C85C" stroke-opacity="0.55" stroke-width="2"/><rect x="506" y="182" width="69" height="22" rx="11" fill="#F7C85C"/><text x="540.5" y="198" font-size="12" font-weight="800" fill="#081334" text-anchor="middle" letter-spacing="1.2">GRADER</text><text x="506" y="230" font-size="18" font-weight="900" fill="#fff">3 · Equipped grader</text><text x="506" y="254" font-size="14" font-weight="500" fill="#d9d3ff">Deterministic checks,</text><text x="506" y="274" font-size="14" font-weight="500" fill="#d9d3ff">an LLM judge that</text><text x="506" y="294" font-size="14" font-weight="500" fill="#d9d3ff">recomputes and reads</text><text x="506" y="314" font-size="14" font-weight="500" fill="#d9d3ff">the code</text>
<rect x="715" y="168" width="200" height="170" rx="18" fill="#16246a" stroke="#F7C85C" stroke-opacity="0.55" stroke-width="2"/><rect x="731" y="182" width="69" height="22" rx="11" fill="#F7C85C"/><text x="765.5" y="198" font-size="12" font-weight="800" fill="#081334" text-anchor="middle" letter-spacing="1.2">REPORT</text><text x="731" y="230" font-size="19" font-weight="900" fill="#fff">4 · Report, gates</text><text x="731" y="254" font-size="14" font-weight="500" fill="#d9d3ff">pass rate, pass@k,</text><text x="731" y="274" font-size="14" font-weight="500" fill="#d9d3ff">pass^k, difficulty and</text><text x="731" y="294" font-size="14" font-weight="500" fill="#d9d3ff">quality gates, key flags</text>
<rect x="940" y="168" width="180" height="170" rx="18" fill="url(#hu)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/><rect x="956" y="182" width="61" height="22" rx="11" fill="#081334"/><text x="986.5" y="198" font-size="12" font-weight="800" fill="#F7C85C" text-anchor="middle" letter-spacing="1.2">HUMAN</text><text x="956" y="230" font-size="19" font-weight="900" fill="#081334">5 · Sign-off</text><text x="956" y="254" font-size="14" font-weight="500" fill="#2a1e10">Judges each failure,</text><text x="956" y="274" font-size="14" font-weight="500" fill="#2a1e10">rules on key flags,</text><text x="956" y="294" font-size="14" font-weight="500" fill="#2a1e10">signs like an EOR</text>
<line class="flow" x1="242" y1="253.0" x2="261" y2="253.0" stroke="#F7C85C" stroke-width="3" marker-end="url(#ar)"/>
<line class="flow" x1="467" y1="253.0" x2="486" y2="253.0" stroke="#F7C85C" stroke-width="3" marker-end="url(#ar)"/>
<line class="flow" x1="692" y1="253.0" x2="711" y2="253.0" stroke="#F7C85C" stroke-width="3" marker-end="url(#ar)"/>
<line class="flow" x1="917" y1="253.0" x2="936" y2="253.0" stroke="#F7C85C" stroke-width="3" marker-end="url(#ar)"/>
<path class="flow" d="M1030,166 C1030,120 140,120 140,164" fill="none" stroke="#E8607A" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="585.0" y="124" font-size="13" font-weight="700" fill="#ffb3c1" text-anchor="middle">too easy, or a flaw in the key → redesign the task</text>
<rect class="pulse" x="265" y="420" width="425" height="200" rx="20" fill="#1b2c80" stroke="url(#bd)" stroke-width="3"/>
<rect x="281" y="434" width="196" height="22" rx="11" fill="#E8607A"/><text x="379" y="450" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="1.2">PRIVATE · RUNS LOCALLY</text>
<text x="281" y="486" font-size="22" font-weight="900" fill="#fff">code-ref library (MCP)</text>
<text x="281" y="516" font-size="14.5" font-weight="500" fill="#e9e4ff">ACI 318-19 and 318-25, ASCE 7-16 and 7-22,</text>
<text x="281" y="538" font-size="14.5" font-weight="500" fill="#e9e4ff">FEMA and NIST guides: search, pages, status</text>
<text x="281" y="560" font-size="14.5" font-weight="500" fill="#e9e4ff">IBC adoption table: the edition a permit needs</text>
<text x="281" y="582" font-size="14.5" font-weight="500" fill="#e9e4ff">Licensed standards stay on my machine</text>
<rect x="740" y="420" width="380" height="200" rx="18" fill="#16246a" stroke="#F7C85C" stroke-opacity="0.55" stroke-width="2"/><rect x="756" y="434" width="134" height="22" rx="11" fill="#F7C85C"/><text x="823.0" y="450" font-size="12" font-weight="800" fill="#081334" text-anchor="middle" letter-spacing="1.2">IN DEVELOPMENT</text><text x="756" y="482" font-size="19" font-weight="900" fill="#fff">Tnega · drawing reviewer</text><text x="756" y="506" font-size="14" font-weight="500" fill="#d9d3ff">Reads the drawing set, checks each member</text><text x="756" y="526" font-size="14" font-weight="500" fill="#d9d3ff">in deterministic code, repeats every check</text><text x="756" y="546" font-size="14" font-weight="500" fill="#d9d3ff">independently, sends life-safety findings</text><text x="756" y="566" font-size="14" font-weight="500" fill="#d9d3ff">to an engineer first. The EOR signs.</text>
<line class="flow" x1="365" y1="416" x2="365" y2="344" stroke="#E8607A" stroke-width="2.5" marker-end="url(#ap)"/>
<line class="flow" x1="590" y1="416" x2="590" y2="344" stroke="#E8607A" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="373" y="382" font-size="12.5" font-weight="700" fill="#ffb3c1">case study: with</text>
<text x="373" y="398" font-size="12.5" font-weight="700" fill="#ffb3c1">vs without the library</text>
<text x="598" y="390" font-size="12.5" font-weight="700" fill="#ffb3c1">checks citations</text>
<line class="flow" x1="692" y1="595" x2="736" y2="595" stroke="#E8607A" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="40" y="460" font-size="15" font-weight="800" fill="#F7C85C">Same checks,</text>
<text x="40" y="482" font-size="15" font-weight="800" fill="#F7C85C">two uses:</text>
<text x="40" y="512" font-size="14.5" font-weight="500" fill="#e9e4ff">measure where models</text>
<text x="40" y="533" font-size="14.5" font-weight="500" fill="#e9e4ff">fail on expert work,</text>
<text x="40" y="554" font-size="14.5" font-weight="500" fill="#e9e4ff">then build the reviewer</text>
<text x="40" y="575" font-size="14.5" font-weight="500" fill="#e9e4ff">on what holds up.</text>
<text x="1120" y="658" font-size="12.5" font-weight="600" fill="#a99ee8" text-anchor="end">Method: “Where the Human Belongs” · github.com/sabaazdn73/expert-eval-harness</text>
</svg>