<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 92" width="1200" height="92" role="img">
<style>
text{font-family:'Hanken Grotesk','Avenir Next','Segoe UI',Helvetica,Arial,sans-serif}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.fl{animation:fl 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translateY(-152px) scale(1.1);opacity:0}}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}

</style>
<defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7C85C"/><stop offset=".35" stop-color="#FF7BA9"/><stop offset=".7" stop-color="#C9B6FF"/><stop offset="1" stop-color="#3B6FE0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="fill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0C1C4F"/><stop offset="1" stop-color="#2a2f8a"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="pill"><rect x="4" y="10" width="1192" height="72" rx="36"/></clipPath></defs>
<rect x="4" y="10" width="1192" height="72" rx="36" fill="url(#fill)" stroke="url(#bd)" stroke-width="3.5"/>
<g clip-path="url(#pill)"><rect y="0" width="220" height="92" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-300;1300;1300" keyTimes="0;.55;1" dur="6s" repeatCount="indefinite"/></rect></g>
<g transform="translate(62 46.0)"><path class="spin" d="M0,-1 C0.12,-0.3 0.3,-0.12 1,0 C0.3,0.12 0.12,0.3 0,1 C-0.12,0.3 -0.3,0.12 -1,0 C-0.3,-0.12 -0.12,-0.3 0,-1Z" transform="scale(22)" fill="#F7C85C"/><path class="tw" d="M0,-1 C0.12,-0.3 0.3,-0.12 1,0 C0.3,0.12 0.12,0.3 0,1 C-0.12,0.3 -0.3,0.12 -1,0 C-0.3,-0.12 -0.12,-0.3 0,-1Z" transform="translate(22 -20) scale(7)" fill="#fff"/></g>
<text x="108" y="58.0" font-size="36" font-weight="900" fill="#fff" letter-spacing=".5">Where Tnega was born</text>
<g transform="translate(1010 54)"><path class="tw" d="M0,-1 C0.12,-0.3 0.3,-0.12 1,0 C0.3,0.12 0.12,0.3 0,1 C-0.12,0.3 -0.3,0.12 -1,0 C-0.3,-0.12 -0.12,-0.3 0,-1Z" fill="#FFB3D1" transform="scale(9)" style="animation-delay:-0.0s;animation-duration:3s"/></g>
<g transform="translate(1070 38)"><path class="tw" d="M0,-1 C0.12,-0.3 0.3,-0.12 1,0 C0.3,0.12 0.12,0.3 0,1 C-0.12,0.3 -0.3,0.12 -1,0 C-0.3,-0.12 -0.12,-0.3 0,-1Z" fill="#F7C85C" transform="scale(11)" style="animation-delay:-0.9s;animation-duration:3s"/></g>
<g transform="translate(1130 54)"><path class="tw" d="M0,-1 C0.12,-0.3 0.3,-0.12 1,0 C0.3,0.12 0.12,0.3 0,1 C-0.12,0.3 -0.3,0.12 -1,0 C-0.3,-0.12 -0.12,-0.3 0,-1Z" fill="#C9B6FF" transform="scale(13)" style="animation-delay:-1.8s;animation-duration:3s"/></g>
</svg>
