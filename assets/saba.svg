<g transform="translate(95 585)"><path class="fl" d="M0,0.9 C-1.5,-0.1 -0.9,-1.1 0,-0.4 C0.9,-1.1 1.5,-0.1 0,0.9Z" fill="#FF7BA9" transform="scale(13)"/></g>
<g transform="translate(560 410)"><path class="fl" style="animation-delay:-4s" d="M0,0.9 C-1.5,-0.1 -0.9,-1.1 0,-0.4 C0.9,-1.1 1.5,-0.1 0,0.9Z" fill="#FFB3D1" transform="scale(10)"/></g>
<g clip-path="url(#clip)"><g class="sway">
