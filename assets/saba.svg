<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-label="Minimal portrait of Saba Azadegan">
<style>
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.ring{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-.8deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-5px)}}
.bf{animation:fly 5s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-12px)}}
.wl,.wr{animation:flap .9s ease-in-out infinite;transform-box:view-box}
.wl{transform-origin:0 0}.wr{transform-origin:0 0}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
</style>
