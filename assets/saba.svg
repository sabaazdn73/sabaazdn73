<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-label="Minimal caricature of Saba Azadegan">
<style>
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.12)}}
.ring{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1deg) translateY(-6px)}}
.eye{animation:blink 5.5s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9EA"/><stop offset=".55" stop-color="#E4D5FF"/><stop offset="1" stop-color="#BFD3FF"/></linearGradient>
<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7BA9"/><stop offset="1" stop-color="#7B4FC9"/></linearGradient>
<clipPath id="clip"><circle cx="320" cy="360" r="300"/></clipPath>
</defs>
<circle cx="320" cy="360" r="300" fill="url(#bg)"/>
