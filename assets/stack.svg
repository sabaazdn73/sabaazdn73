<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 260" width="1200" height="260" role="img">
<style>
text{font-family:'Hanken Grotesk','Avenir Next','Segoe UI',Helvetica,Arial,sans-serif}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.fl{animation:fl 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translateY(-320px) scale(1.1);opacity:0}}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}
.b0{animation:f0 3.7s ease-in-out infinite}@keyframes f0{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}.b1{animation:f1 4.6s ease-in-out infinite}@keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}.b2{animation:f2 3.5s ease-in-out infinite}@keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}.b3{animation:f3 5.0s ease-in-out infinite}@keyframes f3{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}.b4{animation:f4 4.1s ease-in-out infinite}@keyframes f4{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}.b5{animation:f5 4.5s ease-in-out infinite}@keyframes f5{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}.b6{animation:f6 4.0s ease-in-out infinite}@keyframes f6{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}.b7{animation:f7 4.6s ease-in-out infinite}@keyframes f7{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}.b8{animation:f8 3.6s ease-in-out infinite}@keyframes f8{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}.b9{animation:f9 3.7s ease-in-out infinite}@keyframes f9{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}.b10{animation:f10 3.6s ease-in-out infinite}@keyframes f10{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}.b11{animation:f11 4.1s ease-in-out infinite}@keyframes f11{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}.b12{animation:f12 4.2s ease-in-out infinite}@keyframes f12{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}.b13{animation:f13 4.4s ease-in-out infinite}@keyframes f13{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}.b14{animation:f14 4.8s ease-in-out infinite}@keyframes f14{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
</style>
