<text x="44" y="138" font-size="44" font-weight="900" fill="#fff">How AI is trained on</text>
<text x="44" y="192" font-size="44" font-weight="900" fill="#fff">structural engineering</text>
<text x="44" y="236" font-size="20" font-weight="500" fill="#e9e4ff">Tasks, prompts, test models, answer keys, and the</text>
<text x="44" y="264" font-size="20" font-weight="500" fill="#e9e4ff">structural engineer who keeps the loop honest.</text>
